# Baseline target libraries. Additional dependencies need a declared plan and preparation.
# Guarded by services/ai-orchestration/tests/unit/test_stack_profile.py, which
# fails when this drifts from frontend/package.json or backend/pom.xml.
stack: spring-react

frontend:
  root: frontend
  dependencies:
    react: "19.0.0"
    react-dom: "19.0.0"
    react-router: "7.1.1"
    "@tanstack/react-query": "5.62.11"
    zod: "3.24.1"
    tailwindcss: "4.3.3"
    "@tailwindcss/vite": "4.3.3"
    # shadcn/ui + Tailwind theming — the frontend UX section composes shadcn
    # components and generates the theme against these baseline packages.
    "@radix-ui/react-dialog": "1.1.4"
    "@radix-ui/react-label": "2.1.1"
    "@radix-ui/react-slot": "1.1.1"
    class-variance-authority: "0.7.1"
    clsx: "2.1.1"
    lucide-react: "0.469.0"
    tailwind-merge: "3.0.2"
    tw-animate-css: "1.2.5"
  devDependencies:
    "@types/node": "22.20.5"
    "@types/react": "19.0.2"
    "@types/react-dom": "19.0.2"
    "@vitejs/plugin-react": "4.3.4"
    typescript: "5.7.2"
    vite: "6.0.5"
    vitest: "3.2.7"
    "@testing-library/react": "16.1.0"
    "@testing-library/jest-dom": "6.6.3"
    jsdom: "25.0.1"

backend:
  root: backend
  artifacts:
    - org.springframework.boot:spring-boot-starter-web
    - org.springframework.boot:spring-boot-starter-validation
    - org.springframework.boot:spring-boot-starter-actuator
    - org.springframework.boot:spring-boot-starter-data-jpa
    - org.springframework.boot:spring-boot-starter-security
    - org.springdoc:springdoc-openapi-starter-webmvc-ui
    - org.postgresql:postgresql
    - com.mysql:mysql-connector-j
    - org.springframework.boot:spring-boot-starter-test

verification:
  frontend_typecheck: pnpm typecheck
  frontend_test: pnpm test
  backend_compile: mvn -B -o compile
  backend_test: mvn -B -o test

# Epic `area` (the Phase A enum) -> planning stage. Picks the paragraph that
# tells spec and subtask generation what exists when that epic runs — see
# services/ai-orchestration/app/services/prompts/behaviour_rules.py.
epic_stages:
  Shells: shells
  Api: api
  Auth: auth
  Theme: theme
  Layout: layout
  SharedComponents: shared
  Page: page
